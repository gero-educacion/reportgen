steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/reportgen', '.']
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - reportgen
      - --image=gcr.io/$PROJECT_ID/reportgen
      - --region=us-central1
      - --platform=managed

images:
  - gcr.io/$PROJECT_ID/reportgen