version: "3.9"

services:
  reportgen:
    build: .
    ports:
      - "8080:8080"

    # 🔹 THIS reconnects the .env file
    env_file:
      - .env

    # 🔹 Mount secrets + tmp
    volumes:
      - ./secrets:/secrets:ro
      - ./tmp:/tmp

    # (optional but recommended)
    restart: unless-stopped
